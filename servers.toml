# The servers the desk's agent connects to, and which of each server's tools it may declare.
# `allow` is what the lead may be given; `read` is what a worker may be given.
# Leave out `url` to start the server as a local process over stdio.

[orders]
command = ["python", "-m", "src.servers.orders"]
allow = ["search_orders", "find_order", "get_order_history"]
read = ["search_orders", "find_order", "get_order_history"]

[payments]
command = ["python", "-m", "src.servers.payments"]
# url = "https://<your-api>.execute-api.us-east-1.amazonaws.com/mcp"
allow = ["get_charges", "get_refunds", "issue_refund"]
read = ["get_charges", "get_refunds"]

[events]
command = ["python", "-m", "src.servers.events"]
allow = ["get_events", "search_events"]
read = ["get_events", "search_events"]
